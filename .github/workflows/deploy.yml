name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # prisma.config.ts evaluates env("DATABASE_URL") during `prisma generate`
  # (postinstall). CI never connects — a syntactically valid placeholder is enough.
  DATABASE_URL: "postgresql://user:pass@localhost:5432/career"

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  supabase:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # needed to push the Prisma schema-sync commit below
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: "2.33.9"   # pin; bump deliberately alongside supabase/.temp/cli-latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # The Prisma boundary (CLAUDE.md): schema.prisma is introspected, never
      # authored, and `email-logs.ts`'s update() writes through Prisma. A
      # migration that adds/renames a column is invisible to that write path
      # until schema.prisma is regenerated against a database that already
      # has it — this used to be a manual step someone had to remember to run
      # locally after every migration, which is exactly the kind of thing that
      # gets forgotten and 500s in production. Doing it here, against the
      # database `supabase db push` just migrated, removes the gap entirely.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (for the Prisma CLI)
        run: npm ci

      - name: Regenerate prisma/schema.prisma from the hosted database
        run: npx prisma db pull && npx prisma generate
        env:
          # Same pooler shape as scripts/repoint-career-supabase.sh / .env.example
          # (direct db.<ref> host is IPv6-only from most runners; the pooler isn't).
          DATABASE_URL: "postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require"

      - name: Commit schema.prisma if the hosted schema drifted
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "prisma/schema.prisma already matches the hosted schema"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "chore(prisma): sync schema.prisma with hosted schema

          Auto-committed by the supabase job in .github/workflows/deploy.yml
          after supabase db push, so the Prisma write path never runs
          against a schema older than the migration that just landed."
          git push origin HEAD:main

      - name: Deploy the classifier worker
        run: supabase functions deploy email-classifier-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Sync edge-function secrets (Cloudflare Workers AI credentials)
        run: |
          umask 077
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\nCLOUDFLARE_API_TOKEN=%s\n' \
            "$CF_ACCOUNT_ID" "$CF_API_TOKEN" > fn.env
          supabase secrets set --env-file fn.env
          rm -f fn.env
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    needs: [verify, supabase]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-mini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # OAuth route instead: replace `authkey` with
          #   oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          #   oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          #   tags: tag:ci

      - name: Redeploy on the Mac mini
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MINI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$MINI_HOSTKEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$MINI_USER@$MINI_HOST" 'bash -s' < scripts/deploy-on-mini.sh
        env:
          MINI_SSH_KEY: ${{ secrets.MINI_SSH_KEY }}
          MINI_HOSTKEY: ${{ secrets.MINI_SSH_HOSTKEY }}
          MINI_HOST: ${{ vars.MINI_SSH_HOST }}
          MINI_USER: ${{ vars.MINI_SSH_USER }}
