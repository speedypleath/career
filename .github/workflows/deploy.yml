name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # swagger-ui-dist pulls @scarf/scarf, which phones home on install unless told not to.
  SCARF_ANALYTICS: "false"
  # prisma.config.ts evaluates env("DATABASE_URL") during `prisma generate`
  # (postinstall). CI never connects — a syntactically valid placeholder is enough.
  DATABASE_URL: "postgresql://user:pass@localhost:5432/career"

# Least privilege by default — only the supabase job (schema-sync commit)
# needs to write to the repo, and declares its own override for that.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4.4.0 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:openapi   # docs/openapi.yaml — served at /api/docs
      - run: npm run build
      - run: npm test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-security-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4.4.0 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Dependency vulnerabilities. The gate fails on any HIGH/CRITICAL advisory
      # that is not explicitly allow-listed in audit-ci.jsonc — the known ones
      # there all live in the Prisma 7 CLI dependency tree (mysql2, deepmerge-ts)
      # and are unreachable from this Postgres-only app.
      - run: npx audit-ci --config audit-ci.jsonc

  supabase:
    needs: [verify, security]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # needed to push the Prisma schema-sync commit below
    timeout-minutes: 15
    # Serialized, never cancelled mid-migration — same reasoning as deploy's
    # group below. One hosted database: two overlapping runs must queue, not
    # race `supabase db push` or the schema-sync git push against each other.
    concurrency:
      group: ${{ github.workflow }}-supabase-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: "2.33.9"   # pin; bump deliberately alongside supabase/.temp/cli-latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # The Prisma boundary (CLAUDE.md): schema.prisma is introspected, never
      # authored, and `email-logs.ts`'s update() writes through Prisma. A
      # migration that adds/renames a column is invisible to that write path
      # until schema.prisma is regenerated against a database that already
      # has it — this used to be a manual step someone had to remember to run
      # locally after every migration, which is exactly the kind of thing that
      # gets forgotten and 500s in production. Doing it here, against the
      # database `supabase db push` just migrated, removes the gap entirely.
      - uses: actions/setup-node@v4.4.0 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (for the Prisma CLI)
        run: npm ci

      - name: Regenerate prisma/schema.prisma from the hosted database
        run: npx prisma db pull && npx prisma generate
        env:
          # Same pooler shape as ops/repoint-career-supabase.sh / .env.example
          # (direct db.<ref> host is IPv6-only from most runners; the pooler isn't).
          DATABASE_URL: "postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require"

      - name: Commit schema.prisma if the hosted schema drifted
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "prisma/schema.prisma already matches the hosted schema"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "chore(prisma): sync schema.prisma with hosted schema [skip ci]

          Auto-committed by the supabase job in .github/workflows/deploy.yml
          after supabase db push, so the Prisma write path never runs
          against a schema older than the migration that just landed.
          [skip ci] keeps this push from re-triggering the whole workflow."
          git push origin HEAD:main

      - name: Deploy the classifier worker
        run: supabase functions deploy email-classifier-worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Sync edge-function secrets (Cloudflare Workers AI credentials)
        run: |
          umask 077
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\nCLOUDFLARE_API_TOKEN=%s\n' \
            "$CF_ACCOUNT_ID" "$CF_API_TOKEN" > fn.env
          supabase secrets set --env-file fn.env
          rm -f fn.env
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    needs: [verify, security, supabase]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-deploy-mini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # OAuth route instead: replace `authkey` with
          #   oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          #   oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          #   tags: tag:ci

      - name: Redeploy on the Mac mini
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MINI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$MINI_HOSTKEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$MINI_USER@$MINI_HOST" 'bash -s' < ops/deploy-on-mini.sh
        env:
          MINI_SSH_KEY: ${{ secrets.MINI_SSH_KEY }}
          MINI_HOSTKEY: ${{ secrets.MINI_SSH_HOSTKEY }}
          MINI_HOST: ${{ vars.MINI_SSH_HOST }}
          MINI_USER: ${{ vars.MINI_SSH_USER }}
